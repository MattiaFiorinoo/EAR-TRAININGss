<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Riconoscitore Note Pianoforte</title>
    <style>
        :root {
            --bg-color: #121214;
            --card-bg: #1e1e24;
            --accent-color: #ff3b30;
            --btn-grey: #3a3a3c;
            --text-color: #ffffff;
            --subtext-color: #a1a1a6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 15px;
            overflow-x: hidden;
        }

        /* Controlli posizionati in alto */
        .controls {
            display: flex;
            gap: 12px;
            margin-bottom: 15px;
        }

        .btn {
            flex: 1;
            padding: 16px;
            border: none;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 600;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn:active {
            transform: scale(0.97);
        }

        /* Pulsante Registra Grigio Chiaro */
        .btn-record {
            background-color: var(--btn-grey);
            color: var(--text-color);
        }

        /* Pulsante quando sta registrando (Rosso) */
        .btn-record.recording {
            background-color: var(--accent-color);
        }

        .btn-clear {
            background-color: #2c2c2e;
            color: #ff453a;
            max-width: 30%;
        }

        /* Sequenza Note */
        .timeline-wrapper {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 15px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .timeline-title {
            font-size: 0.85rem;
            color: var(--subtext-color);
            margin-bottom: 12px;
        }

        /* Griglia da 4 note per fila */
        .timeline {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            overflow-y: auto;
            padding: 5px;
            height: 100%;
            align-content: start;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }

        .timeline::-webkit-scrollbar {
            width: 6px;
        }

        .timeline::-webkit-scrollbar-thumb {
            background: #3a3a3c;
            border-radius: 3px;
        }

        .note-card {
            background: #2c2c2e;
            border: 1px solid #3a3a3c;
            border-radius: 12px;
            padding: 12px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            animation: popIn 0.25s ease-out;
            width: 100%;
        }

        .note-card .name {
            font-size: 1.3rem;
            font-weight: 700;
        }

        .note-card .octave {
            font-size: 0.7rem;
            color: var(--subtext-color);
            margin-top: 2px;
        }

        @keyframes popIn {
            0% { transform: scale(0.6); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        @supports (padding-top: env(safe-area-inset-top)) {
            body {
                padding-top: calc(15px + env(safe-area-inset-top));
                padding-bottom: calc(15px + env(safe-area-inset-bottom));
            }
        }
    </style>
</head>
<body>

    <!-- Controlli in alto -->
    <div class="controls">
        <button class="btn btn-record" id="recordBtn">
            <span id="recordIcon">🔴</span>
            <span id="recordText">Avvia</span>
        </button>
        <button class="btn btn-clear" id="clearBtn">
            🗑️ Cancella
        </button>
    </div>

    <!-- Sequenza note -->
    <div class="timeline-wrapper">
        <div class="timeline-title">➡️ Sequenza Note Cronologica</div>
        <div class="timeline" id="timeline"></div>
    </div>

    <script>
        const NOTE_NAMES = ["Do", "Do♯", "Re", "Re♯", "Mi", "Fa", "Fa♯", "Sol", "Sol♯", "La", "La♯", "Si"];

        let audioContext = null;
        let analyser = null;
        let microphoneStream = null;
        let isRecording = false;
        let animationId = null;

        const pitchHistory = [];
        const HISTORY_SIZE = 5;

        let lastConfirmedNote = null;
        let noteLocked = false; // Impedisce la ripetizione mentre la nota rimane la stessa
        let silenceFrames = 0;

        const recordBtn = document.getElementById('recordBtn');
        const recordIcon = document.getElementById('recordIcon');
        const recordText = document.getElementById('recordText');
        const clearBtn = document.getElementById('clearBtn');
        const timelineEl = document.getElementById('timeline');

        recordBtn.addEventListener('click', async () => {
            if (!isRecording) {
                await startRecording();
            } else {
                stopRecording();
            }
        });

        clearBtn.addEventListener('click', () => {
            timelineEl.innerHTML = '';
            lastConfirmedNote = null;
            noteLocked = false;
            pitchHistory.length = 0;
        });

        async function startRecording() {
            try {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                
                microphoneStream = await navigator.mediaDevices.getUserMedia({ 
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: false
                    }, 
                    video: false 
                });
                
                const source = audioContext.createMediaStreamSource(microphoneStream);
                
                const highPass = audioContext.createBiquadFilter();
                highPass.type = "highpass";
                highPass.frequency.value = 25;

                analyser = audioContext.createAnalyser();
                analyser.fftSize = 2048;

                source.connect(highPass);
                highPass.connect(analyser);

                isRecording = true;
                recordBtn.classList.add('recording');
                recordIcon.textContent = '⏹️';
                recordText.textContent = 'Stop';

                processAudio();
            } catch (err) {
                alert("Impossibile accedere al microfono. Assicurati di usare HTTPS.");
                console.error(err);
            }
        }

        function stopRecording() {
            isRecording = false;
            if (animationId) cancelAnimationFrame(animationId);
            if (microphoneStream) microphoneStream.getTracks().forEach(track => track.stop());
            if (audioContext) audioContext.close();

            recordBtn.classList.remove('recording');
            recordIcon.textContent = '🔴';
            recordText.textContent = 'Avvia';
        }

        function processAudio() {
            if (!isRecording) return;

            const buffer = new Float32Array(analyser.fftSize);
            analyser.getFloatTimeDomainData(buffer);

            let rms = 0;
            for (let i = 0; i < buffer.length; i++) {
                rms += buffer[i] * buffer[i];
            }
            rms = Math.sqrt(rms / buffer.length);

            const pitch = detectPitchYIN(buffer, audioContext.sampleRate, rms);

            if (pitch !== -1 && pitch >= 27.5 && pitch <= 4186) {
                silenceFrames = 0;
                
                pitchHistory.push(pitch);
                if (pitchHistory.length > HISTORY_SIZE) {
                    pitchHistory.shift();
                }

                if (pitchHistory.length === HISTORY_SIZE) {
                    const sortedPitches = [...pitchHistory].sort((a, b) => a - b);
                    const medianPitch = sortedPitches[Math.floor(HISTORY_SIZE / 2)];

                    const noteInfo = getNoteFromFrequency(medianPitch);
                    const fullNoteName = `${noteInfo.name}${noteInfo.octave}`;

                    // Se cambia la nota, resetta il blocco per la nuova nota
                    if (lastConfirmedNote !== fullNoteName) {
                        noteLocked = false;
                    }

                    // Aggiunge la nota SOLO se non è già "bloccata" (ossia se è una nota nuova o appena ribattuta)
                    if (!noteLocked) {
                        addNoteToTimeline(noteInfo.name, noteInfo.octave);
                        lastConfirmedNote = fullNoteName;
                        noteLocked = true; // Blocca ulteriori inserimenti della STESSA nota finché dura il suono
                    }
                }
            } else {
                silenceFrames++;
                // Quando c'è un breve silenzio (tra una nota e l'altra o quando il tasto viene rilasciato)
                if (silenceFrames > 5) {
                    pitchHistory.length = 0;
                    lastConfirmedNote = null;
                    noteLocked = false; // Sblocca il sistema: pronto a rilevare la prossima nota (anche se è lo stesso La)
                }
            }

            animationId = requestAnimationFrame(processAudio);
        }

        function getNoteFromFrequency(frequency) {
            const A4 = 440;
            const noteNum = 12 * (Math.log(frequency / A4) / Math.log(2));
            const midiNote = Math.round(noteNum) + 69;
            
            const noteIndex = (midiNote % 12 + 12) % 12;
            const octave = Math.floor(midiNote / 12) - 1;

            return {
                name: NOTE_NAMES[noteIndex],
                octave: octave
            };
        }

        function addNoteToTimeline(noteName, octave) {
            const card = document.createElement('div');
            card.className = 'note-card';
            card.innerHTML = `
                <div class="name">${noteName}</div>
                <div class="octave">Ottava ${octave}</div>
            `;
            timelineEl.appendChild(card);
            timelineEl.scrollTop = timelineEl.scrollHeight;
        }

        function detectPitchYIN(buffer, sampleRate, rms) {
            const threshold = 0.08;
            const bufferSize = buffer.length;
            const yinBuffer = new Float32Array(bufferSize / 2);

            if (rms < 0.02) return -1;

            for (let tau = 0; tau < yinBuffer.length; tau++) {
                yinBuffer[tau] = 0;
                for (let i = 0; i < yinBuffer.length; i++) {
                    const delta = buffer[i] - buffer[i + tau];
                    yinBuffer[tau] += delta * delta;
                }
            }

            yinBuffer[0] = 1;
            let runningSum = 0;
            for (let tau = 1; tau < yinBuffer.length; tau++) {
                runningSum += yinBuffer[tau];
                yinBuffer[tau] *= tau / runningSum;
            }

            let tau = -1;
            for (let t = 1; t < yinBuffer.length; t++) {
                if (yinBuffer[t] < threshold) {
                    while (t + 1 < yinBuffer.length && yinBuffer[t + 1] < yinBuffer[t]) {
                        t++;
                    }
                    tau = t;
                    break;
                }
            }

            if (tau === -1 || yinBuffer[tau] >= threshold) return -1;

            return sampleRate / tau;
        }
    </script>
</body>
</html>
