<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Riconoscitore Note Pianoforte</title>
    <style>
        :root {
            --bg-color: #121214;
            --card-bg: #1e1e24;
            --accent-color: #ff3b30;
            --accent-green: #34c759;
            --text-color: #ffffff;
            --subtext-color: #a1a1a6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px 15px;
            overflow-x: hidden;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 5px;
        }

        p.subtitle {
            font-size: 0.85rem;
            color: var(--subtext-color);
        }

        .live-note-container {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }

        .live-note-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--subtext-color);
            margin-bottom: 5px;
        }

        .live-note {
            font-size: 3.5rem;
            font-weight: 700;
            color: #5e5ce6;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .timeline-wrapper {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 15px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            margin-bottom: 20px;
            overflow: hidden;
            min-height: 180px;
        }

        .timeline-title {
            font-size: 0.85rem;
            color: var(--subtext-color);
            margin-bottom: 10px;
        }

        .timeline {
            display: flex;
            align-items: center;
            gap: 12px;
            overflow-x: auto;
            padding: 10px 5px;
            height: 100%;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }

        .timeline::-webkit-scrollbar {
            height: 6px;
        }

        .timeline::-webkit-scrollbar-thumb {
            background: #3a3a3c;
            border-radius: 3px;
        }

        .note-card {
            background: #2c2c2e;
            border: 1px solid #3a3a3c;
            border-radius: 12px;
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-width: 65px;
            animation: popIn 0.25s ease-out;
            flex-shrink: 0;
        }

        .note-card .name {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .note-card .octave {
            font-size: 0.75rem;
            color: var(--subtext-color);
            margin-top: 2px;
        }

        @keyframes popIn {
            0% { transform: scale(0.6); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .controls {
            display: flex;
            gap: 12px;
        }

        .btn {
            flex: 1;
            padding: 16px;
            border: none;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 600;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn-record {
            background-color: var(--accent-green);
        }

        .btn-record.recording {
            background-color: var(--accent-color);
        }

        .btn-clear {
            background-color: #2c2c2e;
            color: #ff453a;
            max-width: 30%;
        }

        @supports (padding-bottom: env(safe-area-inset-bottom)) {
            body {
                padding-bottom: calc(20px + env(safe-area-inset-bottom));
                padding-top: calc(20px + env(safe-area-inset-top));
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>🎹 Note Pianoforte</h1>
        <p class="subtitle">Filtro Risonanza Attivo</p>
    </header>

    <div class="live-note-container">
        <div class="live-note-label">Nota rilevata</div>
        <div class="live-note" id="liveNote">--</div>
    </div>

    <div class="timeline-wrapper">
        <div class="timeline-title">➡️ Sequenza Note (Cronologica)</div>
        <div class="timeline" id="timeline"></div>
    </div>

    <div class="controls">
        <button class="btn btn-record" id="recordBtn">
            <span id="recordIcon">🔴</span>
            <span id="recordText">Avvia</span>
        </button>
        <button class="btn btn-clear" id="clearBtn">
            🗑️ Cancella
        </button>
    </div>

    <script>
        const NOTE_NAMES = ["Do", "Do♯", "Re", "Re♯", "Mi", "Fa", "Fa♯", "Sol", "Sol♯", "La", "La♯", "Si"];

        let audioContext = null;
        let analyser = null;
        let microphoneStream = null;
        let isRecording = false;
        let animationId = null;

        // Parametri per la stabilizzazione del pianoforte
        let candidateNote = null;
        let candidateCount = 0;
        const STABILITY_THRESHOLD = 8; // La nota deve essere rilevata stabilmente per ~150ms
        let lastAddedNote = null;
        let silenceCount = 0;

        const recordBtn = document.getElementById('recordBtn');
        const recordIcon = document.getElementById('recordIcon');
        const recordText = document.getElementById('recordText');
        const clearBtn = document.getElementById('clearBtn');
        const liveNoteEl = document.getElementById('liveNote');
        const timelineEl = document.getElementById('timeline');

        recordBtn.addEventListener('click', async () => {
            if (!isRecording) {
                await startRecording();
            } else {
                stopRecording();
            }
        });

        clearBtn.addEventListener('click', () => {
            timelineEl.innerHTML = '';
            liveNoteEl.textContent = '--';
            lastAddedNote = null;
            candidateNote = null;
            candidateCount = 0;
        });

        async function startRecording() {
            try {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                
                microphoneStream = await navigator.mediaDevices.getUserMedia({ 
                    audio: {
                        echoCancellation: false,
                        noiseSuppression: true,
                        autoGainControl: false
                    }, 
                    video: false 
                });
                
                const source = audioContext.createMediaStreamSource(microphoneStream);
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 4096; // Risoluzione di frequenza aumentata
                source.connect(analyser);

                isRecording = true;
                recordBtn.classList.add('recording');
                recordIcon.textContent = '⏹️';
                recordText.textContent = 'Stop';

                processAudio();
            } catch (err) {
                alert("Impossibile accedere al microfono. Assicurati di usare HTTPS e concedere i permessi.");
                console.error(err);
            }
        }

        function stopRecording() {
            isRecording = false;
            if (animationId) cancelAnimationFrame(animationId);
            
            if (microphoneStream) {
                microphoneStream.getTracks().forEach(track => track.stop());
            }
            if (audioContext) {
                audioContext.close();
            }

            recordBtn.classList.remove('recording');
            recordIcon.textContent = '🔴';
            recordText.textContent = 'Registra';
            liveNoteEl.textContent = '--';
        }

        function processAudio() {
            if (!isRecording) return;

            const buffer = new Float32Array(analyser.fftSize);
            analyser.getFloatTimeDomainData(buffer);

            const pitch = detectPitchYIN(buffer, audioContext.sampleRate);

            if (pitch !== -1 && pitch >= 27.5 && pitch <= 4186) {
                silenceCount = 0;
                const noteInfo = getNoteFromFrequency(pitch);
                const fullNoteName = `${noteInfo.name}${noteInfo.octave}`;

                liveNoteEl.textContent = fullNoteName;

                // Controllo di stabilità temporale (elimina falsi positivi/semitoni transienti)
                if (candidateNote === fullNoteName) {
                    candidateCount++;
                } else {
                    candidateNote = fullNoteName;
                    candidateCount = 1;
                }

                // Aggiunge la nota alla timeline solo se la frequenza resta ferma
                if (candidateCount >= STABILITY_THRESHOLD && lastAddedNote !== fullNoteName) {
                    addNoteToTimeline(noteInfo.name, noteInfo.octave);
                    lastAddedNote = fullNoteName;
                }
            } else {
                silenceCount++;
                // Resetta il blocco se c'è una pausa tra le note
                if (silenceCount > 5) {
                    liveNoteEl.textContent = '--';
                    lastAddedNote = null;
                    candidateNote = null;
                    candidateCount = 0;
                }
            }

            animationId = requestAnimationFrame(processAudio);
        }

        function getNoteFromFrequency(frequency) {
            const A4 = 440;
            const noteNum = 12 * (Math.log(frequency / A4) / Math.log(2));
            const midiNote = Math.round(noteNum) + 69;
            
            const noteIndex = (midiNote % 12 + 12) % 12;
            const octave = Math.floor(midiNote / 12) - 1;

            return {
                name: NOTE_NAMES[noteIndex],
                octave: octave
            };
        }

        function addNoteToTimeline(noteName, octave) {
            const card = document.createElement('div');
            card.className = 'note-card';
            card.innerHTML = `
                <div class="name">${noteName}</div>
                <div class="octave">Ottava ${octave}</div>
            `;
            timelineEl.appendChild(card);
            timelineEl.scrollLeft = timelineEl.scrollWidth;
        }

        function detectPitchYIN(buffer, sampleRate) {
            const threshold = 0.10; // Soglia più restrittiva per ignorare armonici sporchi
            const bufferSize = buffer.length;
            const yinBuffer = new Float32Array(bufferSize / 2);

            let rms = 0;
            for (let i = 0; i < bufferSize; i++) {
                rms += buffer[i] * buffer[i];
            }
            rms = Math.sqrt(rms / bufferSize);
            
            // Soglia minima di volume per ignorare il rumore di fondo della stanza
            if (rms < 0.02) return -1;

            for (let tau = 0; tau < yinBuffer.length; tau++) {
                yinBuffer[tau] = 0;
                for (let i = 0; i < yinBuffer.length; i++) {
                    const delta = buffer[i] - buffer[i + tau];
                    yinBuffer[tau] += delta * delta;
                }
            }

            yinBuffer[0] = 1;
            let runningSum = 0;
            for (let tau = 1; tau < yinBuffer.length; tau++) {
                runningSum += yinBuffer[tau];
                yinBuffer[tau] *= tau / runningSum;
            }

            let tau = -1;
            for (let t = 1; t < yinBuffer.length; t++) {
                if (yinBuffer[t] < threshold) {
                    while (t + 1 < yinBuffer.length && yinBuffer[t + 1] < yinBuffer[t]) {
                        t++;
                    }
                    tau = t;
                    break;
                }
            }

            if (tau === -1 || yinBuffer[tau] >= threshold) return -1;

            return sampleRate / tau;
        }
    </script>
</body>
</html>
